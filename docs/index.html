<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jira Monday Brief | Generate Report</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f4f5f7;
      color: #172b4d;
    }

    .container {
      width: min(560px, calc(100% - 32px));
      text-align: center;
    }

    .panel {
      background: #ffffff;
      border: 1px solid #dfe1e6;
      border-radius: 12px;

      padding: 42px 32px;

      box-shadow:
        0 4px 12px rgba(9, 30, 66, 0.08);
    }

    h1 {
      margin: 0 0 12px;

      font-size: 30px;
      font-weight: 700;
    }

    .description {
      margin: 0 0 28px;

      color: #6b778c;
      font-size: 15px;
      line-height: 1.6;
    }

    .generate-button {
      display: inline-block;

      padding: 14px 24px;

      border-radius: 7px;

      background: #0052cc;
      color: #ffffff;

      text-decoration: none;

      font-size: 16px;
      font-weight: 700;

      transition:
        background 0.2s ease,
        transform 0.1s ease;
    }

    .generate-button:hover {
      background: #0747a6;
    }

    .generate-button:active {
      transform: translateY(1px);
    }

    .note {
      margin-top: 22px;

      color: #6b778c;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="panel">

      <h1>Jira Monday Brief</h1>

      <p class="description">
        Generate an on-demand Jira Cloud report using the
        authenticated GitHub Actions workflow.
      </p>

      <a
        class="generate-button"
        href="https://github.com/nikhilsugathan/jira-monday-brief/actions/workflows/jira-report.yml"
        target="_blank"
        rel="noopener noreferrer"
      >
        Generate Report
      </a>

      <div class="note">
        In GitHub Actions, choose the reporting period and optional
        status filters, then click <strong>Run workflow</strong>.
      </div>

    </section>

  </main>

</body>
</html>
