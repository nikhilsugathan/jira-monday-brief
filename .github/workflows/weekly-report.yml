name: Jira Monday Brief

on:
  workflow_dispatch:
    inputs:
      report_period:
        description: "Report period"
        required: true
        default: "previous-week"
        type: choice
        options:
          - previous-week
          - previous-2-weeks
          - previous-30-days
          - custom

      start_date:
        description: "Custom start date (YYYY-MM-DD)"
        required: false
        type: string

      end_date:
        description: "Custom end date (YYYY-MM-DD)"
        required: false
        type: string

  schedule:
    - cron: "0 10 * * 1"
      timezone: "Europe/Berlin"

permissions:
  contents: read

jobs:
  weekly-report:
    runs-on: ubuntu-latest

    env:
      JIRA_URL: ${{ secrets.JIRA_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}

      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Jira access
        run: python jira_report.py --smoke-test

      - name: Generate and email report
        env:
          REPORT_PERIOD: ${{ inputs.report_period }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}

        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then

            echo "Scheduled Monday report"
            python jira_report.py \
              --period previous-week \
              --send-email

          elif [ "$REPORT_PERIOD" = "custom" ]; then

            if [ -z "$START_DATE" ] || [ -z "$END_DATE" ]; then
              echo "[FAIL] Custom reports require start_date and end_date."
              exit 1
            fi

            echo "Custom report: $START_DATE to $END_DATE"

            python jira_report.py \
              --period custom \
              --start "$START_DATE" \
              --end "$END_DATE" \
              --send-email

          else

            echo "On-demand report: $REPORT_PERIOD"

            python jira_report.py \
              --period "$REPORT_PERIOD" \
              --send-email

          fi